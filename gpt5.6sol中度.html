<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican Pedal Club</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: #d7f0ed; }
  .scene { display: block; width: 100%; height: 100svh; min-height: 360px; }
  .ink { stroke: #294647; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .wheel { animation: spin 1.8s linear infinite; }
  .rear { transform-origin: 390px 535px; }
  .front { transform-origin: 720px 535px; }
  .crank { transform-origin: 535px 525px; animation: spin 1.2s linear infinite; }
  .bob { animation: bob .6s ease-in-out infinite; }
  .wing { transform-origin: 495px 358px; animation: wing .6s ease-in-out infinite; }
  .scarf { transform-origin: 577px 295px; animation: flutter .6s ease-in-out infinite alternate; }
  .leg { animation: pedal 1.2s linear infinite; }
  .leg-back { animation-delay: -.6s; }
  .clouds { animation: landscape 65s linear infinite; }
  .hills { animation: landscape 26s linear infinite; }
  .plants { animation: landscape 9s linear infinite; }
  .road { animation: landscape 4s linear infinite; }
  .blink { transform-origin: 611px 236px; animation: blink 5s infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bob { 50% { transform: translateY(-5px); } }
  @keyframes wing { 50% { transform: rotate(-3deg); } }
  @keyframes flutter { to { transform: rotate(7deg); } }
  @keyframes landscape { to { transform: translateX(-1200px); } }
  /* Both feet follow the crank endpoints; opposite legs are half a cycle apart. */
  @keyframes pedal {
    0%,100% { transform: translate(25px,0); }
    12.5% { transform: translate(17.68px,17.68px); }
    25% { transform: translate(0,25px); }
    37.5% { transform: translate(-17.68px,17.68px); }
    50% { transform: translate(-25px,0); }
    62.5% { transform: translate(-17.68px,-17.68px); }
    75% { transform: translate(0,-25px); }
    87.5% { transform: translate(17.68px,-17.68px); }
  }
  @keyframes blink {
    0%,43%,47%,100% { transform: scaleY(1); }
    45% { transform: scaleY(.08); }
  }
</style>
</head>

    </g>
  </g>
  <g stroke="#fffdf0" stroke-width="4" stroke-linecap="round" opacity=".8">
    <path d="M304 334H338M282 352H325M309 370H337"/>
  </g>
  <g fill="#426352" text-anchor="middle" font-family="Trebuchet MS, Arial, sans-serif">
    <text x="600" y="769" font-size="14" letter-spacing="0">A little pedal. A lovely day.</text>
  </g>
</svg>
</body>
</html>
