<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>鹈鹕骑自行车 🚲</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #8fd0f0 0%, #cfeefa 100%);
  }
  svg {
    width: min(96vw, 880px);
    height: auto;
    display: block;
  }

  /* ---------- 旋转 ---------- */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin {
    transform-box: view-box;
    animation: spin 1.6s linear infinite;
  }
  .crank {
    transform-box: view-box;
    transform-origin: 370px 365px;
    animation: spin 1.6s linear infinite;
  }

  /* ---------- 背景滚动（无缝双 tile） ---------- */
  @keyframes scrollNear { from { transform: translateX(0); } to { transform: translateX(-800px); } }
  @keyframes scrollMid  { from { transform: translateX(0); } to { transform: translateX(-800px); } }
  .scroll-near { transform-box: view-box; animation: scrollNear 3.6s linear infinite; }
  .scroll-near.b { animation-delay: -1.8s; }
  .scroll-mid  { transform-box: view-box; animation: scrollMid 10s linear infinite; }
  .scroll-mid.b { animation-delay: -5s; }

  /* ---------- 云与鸟 ---------- */
  @keyframes drift { from { transform: translateX(880px); } to { transform: translateX(-240px); } }
  .cloud { transform-box: view-box; animation: drift linear infinite; }

  /* ---------- 腿部踩踏（位移动画） ---------- */
  @keyframes pedal {
    0%, 100% { transform: translateY(0); }
    25%      { transform: translateY(-22px); }
    50%      { transform: translateY(0); }
    75%      { transform: translateY(22px); }
  }
  .leg { transform-box: view-box; animation: pedal 1.6s ease-in-out infinite; }
  .leg.leg-b { animation-delay: -0.8s; }

  /* ---------- 身体起伏 ---------- */
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    25%      { transform: translateY(-3px); }
    50%      { transform: translateY(0); }
    75%      { transform: translateY(3px); }
  }
  .bob { transform-box: view-box; animation: bob 1.6s ease-in-out infinite; }

  /* ---------- 翅膀扇动 ---------- */
  @keyframes flap { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(11deg); } }
  .wing { transform-box: view-box; transform-origin: 296px 176px; animation: flap .8s ease-in-out infinite; }

  /* ---------- 尾巴摇摆 ---------- */
  @keyframes wag { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-7deg); } 75% { transform: rotate(5deg); } }
  .tail { transform-box: view-box; transform-origin: 272px 192px; animation: wag 1.6s ease-in-out infinite; }

  /* ---------- 太阳呼吸 ---------- */
  @keyframes sunPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .sun { transform-box: view-box; transform-origin: 680px 92px; animation: sunPulse 4s ease-in-out infinite; }

  /* ---------- 飘起的小心心 ---------- */
  @keyframes heartFloat {
    0%   { transform: translate(0, 0) scale(.6); opacity: 0; }
    15%  { opacity: .95; }
    100% { transform: translate(20px, -66px) scale(1); opacity: 0; }
  }
  .heart { transform-box: view-box; animation: heartFloat 2.4s ease-in-out infinite; }
</style>
</head>
