<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG + CSS 动画</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: linear-gradient(180deg, #2b3242, #191d26);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  svg {
    width: min(96vw, 980px);
    height: auto;
    border-radius: 22px;
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
  }
  .caption {
    color: #8fa3bd;
    margin: 14px 0 0;
    font-size: 15px;
    letter-spacing: .12em;
  }

  /* ============ 旋转类 ============ */
  .wheel-spin { animation: wheelSpin .55s linear infinite; }
  .crank-spin { animation: crankSpin .9s linear infinite; }
  .pedal-spin { animation: pedalSpin .9s linear infinite; }
  .rays-spin  { animation: raysSpin 40s linear infinite; }
  @keyframes wheelSpin { to { transform: rotate(360deg); } }
  @keyframes crankSpin { to { transform: rotate(360deg); } }
  @keyframes pedalSpin { to { transform: rotate(-360deg); } }
  @keyframes raysSpin  { to { transform: rotate(360deg); } }

  /* ============ 背景视差滚动 ============ */
  .clouds-track    { animation: scrollX 48s linear infinite; }
  .farhills-track  { animation: scrollX 26s linear infinite; }
  .nearhills-track { animation: scrollX 13s linear infinite; }
  .bush-track      { animation: scrollX 9s  linear infinite; }
  .dash-track      { animation: dashScroll .19s linear infinite; }
  @keyframes scrollX    { to { transform: translateX(-900px); } }
  @keyframes dashScroll { to { transform: translateX(-170px); } }

  /* ============ 车轮链条 ============ */
  .chain { stroke-dasharray: 6 4; animation: chainRun .3s linear infinite; }
  @keyframes chainRun { to { stroke-dashoffset: -20px; } }

  /* ============ 身体起伏 ============ */
  .bob { animation: bob .45s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  /* ============ 腿部关节(与曲柄 0.9s 同步,几何反解的关键帧) ============ */
  .thigh { animation: thighKick .9s linear infinite; }
  .shin  { animation: shinKick  .9s linear infinite; }
  .foot  { animation: footLevel .9s linear infinite; }
  /* 远侧腿相位差半个周期 = 踩对侧踏板 */
  .far .thigh, .far .shin, .far .foot { animation-delay: -.45s; }

  @keyframes thighKick {
    0%    { transform: rotate(57.8deg); }
    12.5% { transform: rotate(63.2deg); }
    25%   { transform: rotate(50.9deg); }
    37.5% { transform: rotate(28.8deg); }
    50%   { transform: rotate(7.8deg); }
    62.5% { transform: rotate(25.4deg); }
    75%   { transform: rotate(23deg); }
    87.5% { transform: rotate(39.9deg); }
    100%  { transform: rotate(57.8deg); }
  }
  @keyframes shinKick {
    0%    { transform: rotate(-104.1deg); }
    12.5% { transform: rotate(-95.4deg); }
    25%   { transform: rotate(-71.3deg); }
    37.5% { transform: rotate(-41.5deg); }
    50%   { transform: rotate(-18.4deg); }
    62.5% { transform: rotate(-58.9deg); }
    75%   { transform: rotate(-67.2deg); }
    87.5% { transform: rotate(-92.5deg); }
    100%  { transform: rotate(-104.1deg); }
  }
  @keyframes footLevel {
    0%    { transform: rotate(46.3deg); }
    12.5% { transform: rotate(32.2deg); }
    25%   { transform: rotate(20.4deg); }
    37.5% { transform: rotate(12.7deg); }
    50%   { transform: rotate(10.6deg); }
    62.5% { transform: rotate(33.5deg); }
    75%   { transform: rotate(44.2deg); }
    87.5% { transform: rotate(52.6deg); }
    100%  { transform: rotate(46.3deg); }
  }

  /* ============ 小趣味动画 ============ */
  .nod   { animation: nod .9s ease-in-out infinite; transform-origin: 340px 100px; }
  .flag  { animation: flagWave .6s ease-in-out infinite; transform-origin: 452px 156px; }
  .fish  { animation: fishWiggle .7s ease-in-out infinite; transform-origin: 478px 184px; }
  @keyframes nod       { 0%,100% { transform: rotate(2deg); } 50% { transform: rotate(-2deg); } }
  @keyframes flagWave  { 0%,100% { transform: rotate(6deg); } 50% { transform: rotate(-8deg); } }
  @keyframes fishWiggle{ 0%,100% { transform: rotate(4deg); }  50% { transform: rotate(-5deg); } }

  .shadow { transform-box: fill-box; transform-origin: 50% 50%; animation: shadowPulse .45s ease-in-out infinite; }
  @keyframes shadowPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(.88); } }

  .blink { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4.2s linear infinite; }
  @keyframes blink {
    0%, 90%, 98%, 100% { transform: scaleY(1); }
    94%                { transform: scaleY(.08); }
  }

  .speed { animation: slideFade .55s linear infinite; }
  .s2 { animation-delay: .18s; }
  .s3 { animation-delay: .36s; }
  @keyframes slideFade {
    0%   { transform: translateX(40px);   opacity: 0; }
    25%  { opacity: .75; }
    100% { transform: translateX(-160px); opacity: 0; }
  }

  /* 尊重系统减少动效设置 */
  @media (prefers-reduced-motion: reduce) {
    * { animation-play-state: paused !important; }
  }
</style>
</head>
<body>

<svg viewBox="0 0 900 560" role="img" aria-label="一只可爱的卡通鹈鹕在乡间小路上骑自行车">
  <title>鹈鹕骑自行车</title>

  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd4ff"/>
      <stop offset="1" stop-color="#eef9ff"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3adb8"/>
      <stop offset="1" stop-color="#8b95a1"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb46b"/>
      <stop offset="1" stop-color="#ff8c42"/>
    </linearGradient>

    <g id="cloud" fill="#ffffff" opacity=".92">
      <ellipse cx="0"   cy="0"   rx="40" ry="22"/>
      <ellipse cx="35"  cy="-8"  rx="30" ry="18"/>
      <ellipse cx="-35" cy="-5"  rx="28" ry="16"/>
      <ellipse cx="10"  cy="10"  rx="45" ry="16"/>
    </g>
  </defs>

  <!-- ===== 天空 ===== -->
  <rect x="0" y="0" width="900" height="450" fill="url(#skyGrad)"/>

  <!-- ===== 太阳(光芒缓转) ===== -->
  <g transform="translate(770,105)">
    <g class="rays-spin" stroke="#ffce3d" stroke-width="8" stroke-linecap="round">
      <line y1="-48" y2="-66"/>
      <line y1="-48" y2="-66" transform="rotate(36)"/>
      <line y1="-48" y2="-66" transform="rotate(72)"/>
      <line y1="-48" y2="-66" transform="rotate(108)"/>
      <line y1="-48" y2="-66" transform="rotate(144)"/>
      <line y1="-48" y2="-66" transform="rotate(180)"/>
      <line y1="-48" y2="-66" transform="rotate(216)"/>
      <line y1="-48" y2="-66" transform="rotate(252)"/>
      <line y1="-48" y2="-66" transform="rotate(288)"/>
      <line y1="-48" y2="-66" transform="rotate(324)"/>
    </g>
    <circle r="46" fill="#ffe27a" opacity=".35"/>
    <circle r="33" fill="#ffd93d"/>
    <circle cx="-9" cy="-9" r="9" fill="#ffffff" opacity=".55"/>
  </g>

  <!-- ===== 云(视差·最远) ===== -->
  <g class="clouds-track">
    <g id="cloudSet">
      <use href="#cloud" transform="translate(120,95)"/>
      <use href="#cloud" transform="translate(430,155) scale(.75)"/>
      <use href="#cloud" transform="translate(700,70) scale(1.15)"/>
      <use href="#cloud" transform="translate(860,185) scale(.6)"/>
    </g>
    <use href="#cloudSet" x="900"/>
  </g>

  <!-- ===== 远山(视差·中) ===== -->
  <g class="farhills-track">
    <g id="farHillSet" fill="#b9e4c6">
      <ellipse cx="40"  cy="505" rx="150" ry="110"/>
      <ellipse cx="230" cy="495" rx="180" ry="90"/>
      <ellipse cx="430" cy="510" rx="200" ry="120"/>
      <ellipse cx="650" cy="500" rx="160" ry="95"/>
      <ellipse cx="840" cy="515" rx="170" ry="105"/>
    </g>
    <use href="#farHillSet" x="900"/>
  </g>

  <!-- ===== 近山 + 小树(视差·近) ===== -->
  <g class="nearhills-track">
    <g id="nearHillSet">
      <g fill="#8fd0a5">
        <ellipse cx="30"  cy="515" rx="140" ry="95"/>
        <ellipse cx="380" cy="515" rx="150" ry="100"/>
        <ellipse cx="620" cy="508" rx="140" ry="88"/>
        <ellipse cx="850" cy="515" rx="150" ry="98"/>
      </g>
      <g>
        <rect x="146" y="414" width="8" height="10" fill="#9c6b43"/>
        <polygon points="150,386 132,416 168,416" fill="#5fae7f"/>
        <rect x="611" y="418" width="8" height="10" fill="#9c6b43"/>
        <polygon points="615,392 599,420 631,420" fill="#5fae7f"/>
        <rect x="841" y="416" width="8" height="10" fill="#9c6b43"/>
        <polygon points="845,390 828,418 862,418" fill="#5fae7f"/>
      </g>
    </g>
    <use href="#nearHillSet" x="900"/>
  </g>

  <!-- ===== 草地边 ===== -->
  <rect x="0" y="425" width="900" height="20" fill="#a5debb"/>

  <!-- ===== 路边灌木与小花(视差) ===== -->
  <g class="bush-track">
    <g id="bushSet">
      <g fill="#5fae7f">
        <ellipse cx="90"  cy="440" rx="26" ry="13"/>
        <ellipse cx="320" cy="442" rx="30" ry="15"/>
        <ellipse cx="560" cy="439" rx="24" ry="12"/>
        <ellipse cx="780" cy="442" rx="28" ry="14"/>
      </g>
      <g>
        <circle cx="95"  cy="433" r="3.5" fill="#ff8fab"/>
        <circle cx="330" cy="436" r="3.5" fill="#ff8fab"/>
        <circle cx="565" cy="432" r="3.5" fill="#ffd93d"/>
        <circle cx="785" cy="435" r="3.5" fill="#ff8fab"/>
      </g>
    </g>
    <use href="#bushSet" x="900"/>
  </g>

  <!-- ===== 公路与流动虚线 ===== -->
  <rect x="0" y="445" width="900" height="115" fill="url(#roadGrad)"/>
  <rect x="0" y="445" width="900" height="7" fill="#cfd9e2" opacity=".9"/>
  <rect x="0" y="540" width="900" height="20" fill="#000000" opacity=".06"/>
  <g class="dash-track" fill="#ffd93d">
    <rect x="20"   y="496" width="70" height="11" rx="5.5"/>
    <rect x="190"  y="496" width="70" height="11" rx="5.5"/>
    <rect x="360"  y="496" width="70" height="11" rx="5.5"/>
    <rect x="530"  y="496" width="70" height="11" rx="5.5"/>
    <rect x="700"  y="496" width="70" height="11" rx="5.5"/>
    <rect x="870"  y="496" width="70" height="11" rx="5.5"/>
    <rect x="1040" y="496" width="70" height="11" rx="5.5"/>
    <rect x="1210" y="496" width="70" height="11" rx="5.5"/>
    <rect x="1380" y="496" width="70" height="11" rx="5.5"/>
    <rect x="1550" y="496" width="70" height="11" rx="5.5"/>
    <rect x="1720" y="496" width="70" height="11" rx="5.5"/>
  </g>

  <!-- ================= 骑手场景(整体右移居中) ================= -->
  <g transform="translate(160,0)">

    <!-- 速度线 -->
    <g fill="#ffffff">
      <rect class="speed s1" x="10" y="230" width="110" height="8" rx="4"/>
      <rect class="speed s2" x="30" y="300" width="120" height="8" rx="4"/>
      <rect class="speed s3" x="55" y="365" width="90"  height="8" rx="4"/>
    </g>

    <!-- 地面影子(随起伏缩放) -->
    <ellipse class="shadow" cx="305" cy="486" rx="235" ry="15" fill="#1e2833" opacity=".18"/>

    <!-- ===== 远侧腿(在车架后方,相位差 180°) ===== -->
    <g class="far" transform="translate(295,185)">
      <g class="thigh">
        <line x1="0" y1="0" x2="0" y2="95" stroke="#26263a" stroke-width="27" stroke-linecap="round"/>
        <line x1="0" y1="0" x2="0" y2="95" stroke="#d97f2e" stroke-width="17" stroke-linecap="round"/>
        <g transform="translate(0,95)">
          <g class="shin">
            <line x1="0" y1="0" x2="0" y2="125" stroke="#26263a" stroke-width="21" stroke-linecap="round"/>
            <line x1="0" y1="0" x2="0" y2="125" stroke="#d97f2e" stroke-width="11" stroke-linecap="round"/>
            <g transform="translate(0,125)">
              <g class="foot">
                <path d="M-8,-3 C6,-13 30,-12 40,-3 C40,4 30,9 18,9 L-6,9 C-12,9 -13,-1 -8,-3 Z"
                      fill="#d97f2e" stroke="#26263a" stroke-width="4" stroke-linejoin="round"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>

    <!-- ===== 后轮(旋转) ===== -->
    <g transform="translate(140,360)">
      <g class="wheel-spin">
        <circle r="78" fill="none" stroke="#3a3a4c" stroke-width="13"/>
        <circle r="66" fill="none" stroke="#e8ecf3" stroke-width="5"/>
        <g stroke="#cfd6e2" stroke-width="4">
          <line x1="0" y1="-64" x2="0" y2="64"/>
          <line x1="-64" y1="0" x2="64" y2="0"/>
          <line x1="-45.3" y1="-45.3" x2="45.3" y2="45.3"/>
          <line x1="-45.3" y1="45.3" x2="45.3" y2="-45.3"/>
        </g>
        <rect x="-3" y="-74" width="6" height="8" fill="#55556a"/>
        <circle r="9" fill="#55556a"/>
        <circle cx="30" cy="0" r="5" fill="#ffd93d" stroke="#3a3a4c" stroke-width="2"/>
      </g>
    </g>

    <!-- ===== 车架 ===== -->
    <g stroke="#ff6b6b" stroke-width="11" stroke-linecap="round" fill="none">
      <path d="M140,360 L285,360"/>
      <path d="M140,360 L266,230"/>
      <path d="M285,360 L262,224"/>
      <path d="M285,360 L450,252"/>
      <path d="M266,238 Q348,206 448,250"/>
      <path d="M470,360 L446,240" stroke-width="10"/>
    </g>
    <circle cx="285" cy="360" r="8" fill="#ff6b6b"/>
    <circle cx="266" cy="232" r="7" fill="#ff6b6b"/>
    <circle cx="446" cy="246" r="8" fill="#ff6b6b"/>

    <!-- 车座 -->
    <ellipse cx="262" cy="218" rx="40" ry="11" fill="#3a3a4c"/>

    <!-- 车把 -->
    <path d="M446,242 C448,220 440,208 424,208 C412,208 405,213 404,219"
          fill="none" stroke="#3a3a4c" stroke-width="8" stroke-linecap="round"/>
    <circle cx="404" cy="219" r="7" fill="#3a3a4c"/>

    <!-- 链条(流动虚线) -->
    <circle cx="140" cy="360" r="12" fill="#55556a" stroke="#3a3a4c" stroke-width="3"/>
    <line class="chain" x1="140" y1="349" x2="285" y2="345" stroke="#4a4a5c" stroke-width="5"/>
    <line class="chain" x1="140" y1="372" x2="285" y2="378" stroke="#4a4a5c" stroke-width="5"/>

    <!-- ===== 曲柄 + 踏板(曲柄旋转,踏板反向旋转保持水平) ===== -->
    <g transform="translate(285,361)">
      <g class="crank-spin">
        <line x1="0" y1="-40" x2="0" y2="40" stroke="#55556a" stroke-width="9" stroke-linecap="round"/>
        <circle r="13" fill="#6d6d88" stroke="#3a3a4c" stroke-width="4"/>
        <g transform="translate(0,-40)">
          <g class="pedal-spin">
            <rect x="-16" y="-6" width="32" height="11" rx="5" fill="#3a3a4c"/>
            <circle cx="10" cy="0" r="3" fill="#ffd93d"/>
          </g>
        </g>
        <g transform="translate(0,40)">
          <g class="pedal-spin">
            <rect x="-16" y="-6" width="32" height="11" rx="5" fill="#3a3a4c"/>
            <circle cx="10" cy="0" r="3" fill="#ffd93d"/>
          </g>
        </g>
      </g>
    </g>

    <!-- ===== 前轮(旋转) ===== -->
    <g transform="translate(470,360)">
      <g class="wheel-spin">
        <circle r="78" fill="none" stroke="#3a3a4c" stroke-width="13"/>
        <circle r="66" fill="none" stroke="#e8ecf3" stroke-width="5"/>
        <g stroke="#cfd6e2" stroke-width="4">
          <line x1="0" y1="-64" x2="0" y2="64"/>
          <line x1="-64" y1="0" x2="64" y2="0"/>
          <line x1="-45.3" y1="-45.3" x2="45.3" y2="45.3"/>
          <line x1="-45.3" y1="45.3" x2="45.3" y2="-45.3"/>
        </g>
        <rect x="-3" y="-74" width="6" height="8" fill="#55556a"/>
        <circle r="9" fill="#55556a"/>
        <circle cx="30" cy="0" r="5" fill="#ffd93d" stroke="#3a3a4c" stroke-width="2"/>
      </g>
    </g>

    <!-- ===== 车筐 + 小鱼 + 小旗 ===== -->
    <g>
      <line x1="452" y1="190" x2="452" y2="148" stroke="#3a3a4c" stroke-width="5" stroke-linecap="round"/>
      <path class="flag" d="M452,148 L414,156 L452,164 Z"
            fill="#ff6b6b" stroke="#3a3a4c" stroke-width="4" stroke-linejoin="round"/>
      <path d="M452,190 L510,190 L502,234 L460,234 Z"
            fill="#d9a066" stroke="#3a3a4c" stroke-width="5" stroke-linejoin="round"/>
      <path d="M452,204 L507,204 M455,218 L505,218 M470,192 L472,232 M490,192 L489,232"
            stroke="#b9834d" stroke-width="3" fill="none"/>
      <g class="fish">
        <path d="M492,184 L504,176 L502,184 L504,192 Z"
              fill="#8fd3f4" stroke="#3a3a4c" stroke-width="3" stroke-linejoin="round"/>
        <ellipse cx="478" cy="184" rx="17" ry="9" fill="#8fd3f4" stroke="#3a3a4c" stroke-width="4"/>
        <circle cx="466" cy="182" r="2" fill="#3a3a4c"/>
      </g>
    </g>

    <!-- ===== 鹈鹕(整体上下起伏) ===== -->
    <g class="bob">

      <!-- 近侧腿(踩踏关节动画) -->
      <g transform="translate(295,185)">
        <g class="thigh">
          <line x1="0" y1="0" x2="0" y2="95" stroke="#33334d" stroke-width="27" stroke-linecap="round"/>
          <line x1="0" y1="0" x2="0" y2="95" stroke="#ff9f43" stroke-width="17" stroke-linecap="round"/>
          <g transform="translate(0,95)">
            <g class="shin">
              <line x1="0" y1="0" x2="0" y2="125" stroke="#33334d" stroke-width="21" stroke-linecap="round"/>
              <line x1="0" y1="0" x2="0" y2="125" stroke="#ff9f43" stroke-width="11" stroke-linecap="round"/>
              <g transform="translate(0,125)">
                <g class="foot">
                  <path d="M-8,-3 C6,-13 30,-12 40,-3 C40,4 30,9 18,9 L-6,9 C-12,9 -13,-1 -8,-3 Z"
                        fill="#ff9f43" stroke="#33334d" stroke-width="4" stroke-linejoin="round"/>
                </g>
              </g>
            </g>
          </g>
        </g>
      </g>

      <!-- 尾羽 -->
      <path d="M198,148 Q118,140 104,108 Q122,94 138,110 Q132,92 154,90 Q166,106 171,124 Q186,134 200,138 Z"
            fill="#fff8ee" stroke="#33334d" stroke-width="5" stroke-linejoin="round"/>

      <!-- 身体 -->
      <ellipse cx="255" cy="160" rx="88" ry="63"
               fill="#fffdf7" stroke="#33334d" stroke-width="6" paint-order="stroke"/>
      <ellipse cx="250" cy="190" rx="52" ry="28" fill="#ffefd6" opacity=".9"/>

      <!-- 脖子(双层描边管状) -->
      <path d="M308,158 C362,150 336,90 360,68" fill="none" stroke="#33334d" stroke-width="41" stroke-linecap="round"/>
      <path d="M308,158 C362,150 336,90 360,68" fill="none" stroke="#fffdf7" stroke-width="31" stroke-linecap="round"/>

      <!-- 头部(轻微点头) -->
      <g class="nod">
        <!-- 喙 -->
        <path d="M389,68 Q398,128 450,118 Q474,112 480,90 L389,76 Z"
              fill="url(#pouchGrad)" stroke="#33334d" stroke-width="5" stroke-linejoin="round"/>
        <path d="M388,52 L484,84 Q490,88 483,93 L390,74 Z"
              fill="#ffcf6b" stroke="#33334d" stroke-width="5" stroke-linejoin="round"/>
        <path d="M400,60 L418,64" stroke="#33334d" stroke-width="3" stroke-linecap="round"/>
        <path d="M404,86 Q424,98 448,92" fill="none" stroke="#33334d" stroke-width="3" stroke-linecap="round"/>
        <!-- 头 -->
        <circle cx="368" cy="64" r="28" fill="#fffdf7" stroke="#33334d" stroke-width="6" paint-order="stroke"/>
        <!-- 眼睛(会眨) -->
        <g class="blink">
          <circle cx="366" cy="52" r="8" fill="#ffffff" stroke="#33334d" stroke-width="4"/>
          <circle cx="368" cy="53" r="3.8" fill="#33334d"/>
          <circle cx="366.5" cy="51" r="1.5" fill="#ffffff"/>
        </g>
        <!-- 腮红 -->
        <ellipse cx="352" cy="78" rx="8" ry="5" fill="#ffb3ba" opacity=".85"/>
        <!-- 小帽 -->
        <path d="M390,42 Q408,48 402,58 Q392,54 386,50 Z"
