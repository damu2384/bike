<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>骑自行车的鹈鹕 · SVG 动画</title>
<style>
  html, body {
    margin: 0;
    min-height: 100vh;
    background: #0d1526;
    display: grid;
    place-items: center;
  }
  svg {
    width: min(100vw, 180vh);
    height: auto;
    display: block;
    border-radius: 16px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, .55);
  }

  /* ---------- 所有动画元素以 viewBox 坐标作为变换基准 ---------- */
  svg * { transform-box: view-box; }

  @keyframes spin  { to { transform: rotate(360deg); } }
  @keyframes drift { from { transform: translateX(0); }      to { transform: translateX(-900px); } }
  @keyframes slide60 { from { transform: translateX(0); }    to { transform: translateX(-60px); } }
  @keyframes slide50 { from { transform: translateX(0); }    to { transform: translateX(-50px); } }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }
  @keyframes flap {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-3.5deg); }
  }
  @keyframes headbob {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-2.5deg); }
  }
  @keyframes wave {
    0%, 100% { transform: rotate(-9deg); }
    50%      { transform: rotate(10deg); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.07); }
  }

  /* ---------- 背景视差滚动 ---------- */
  .clouds     { animation: drift 22s linear infinite; }
  .hills-far  { animation: drift 14s linear infinite; }
  .hills-near { animation: drift 7s linear infinite; }
  .dashes     { animation: slide60 .4s linear infinite; }
  .grass      { animation: slide50 .33333s linear infinite; }
  .sun        { transform-origin: 120px 96px; animation: pulse 4s ease-in-out infinite; }

  /* ---------- 车轮 / 曲柄 ---------- */
  .wheel-rear  { transform-origin: 272px 378px; animation: spin .5s linear infinite; }
  .wheel-front { transform-origin: 628px 378px; animation: spin .5s linear infinite; }
  .crank       { transform-origin: 448px 372px; animation: spin 1.2s linear infinite; }

  /* ---------- 鹈鹕身体起伏 / 翅膀 / 头 ---------- */
  .pelican { animation: bob .6s ease-in-out infinite; }
  .wing    { transform-origin: 424px 200px; animation: flap .6s ease-in-out infinite; }
  .head    { transform-origin: 470px 192px; animation: headbob 1.2s ease-in-out infinite; }
  .scarf   { transform-origin: 432px 202px; animation: wave .6s ease-in-out infinite; }

  /* ---------- 腿：旋转轴固定在髋关节 ---------- */
  .leg-near .thigh, .leg-far .thigh {
    transform-origin: 408px 268px;
    animation-duration: 1.2s;
    animation-iteration-count: infinite;
    animation-timing-function: linear;
  }
  .leg-near .thigh { animation-name: thighA; }
  .leg-far  .thigh { animation-name: thighB; }
  .leg-near .shin  { transform-origin: 470.6px 299.4px; animation: shinA 1.2s linear infinite; }
  .leg-far  .shin  { transform-origin: 461.4px 313.3px; animation: shinB 1.2s linear infinite; }

  /* ---- 腿部关键帧：由两段式 IK 解算，脚掌始终踩在脚踏上 ---- */
@keyframes thighA {
  0% { transform: rotate(-0.00deg); }
  4.16667% { transform: rotate(7.86deg); }
  8.33333% { transform: rotate(16.05deg); }
  12.5% { transform: rotate(24.11deg); }
  16.6667% { transform: rotate(30.98deg); }
  20.8333% { transform: rotate(34.57deg); }
  25% { transform: rotate(34.42deg); }
  29.1667% { transform: rotate(32.48deg); }
  33.3333% { transform: rotate(29.74deg); }
  37.5% { transform: rotate(26.50deg); }
  41.6667% { transform: rotate(22.78deg); }
  45.8333% { transform: rotate(18.53deg); }
  50% { transform: rotate(13.68deg); }
  54.1667% { transform: rotate(8.15deg); }
  58.3333% { transform: rotate(1.97deg); }
  62.5% { transform: rotate(-4.65deg); }
  66.6667% { transform: rotate(-11.18deg); }
  70.8333% { transform: rotate(-16.81deg); }
  75% { transform: rotate(-20.66deg); }
  79.1667% { transform: rotate(-22.19deg); }
  83.3333% { transform: rotate(-21.29deg); }
  87.5% { transform: rotate(-18.23deg); }
  91.6667% { transform: rotate(-13.39deg); }
  95.8333% { transform: rotate(-7.19deg); }
  100% { transform: rotate(-0.00deg); }
}
@keyframes shinA {
  0% { transform: rotate(-0.00deg); }
  4.16667% { transform: rotate(-10.91deg); }
  8.33333% { transform: rotate(-21.69deg); }
  12.5% { transform: rotate(-31.67deg); }
  16.6667% { transform: rotate(-39.01deg); }
  20.8333% { transform: rotate(-39.82deg); }
  25% { transform: rotate(-33.40deg); }
  29.1667% { transform: rotate(-23.73deg); }
  33.3333% { transform: rotate(-13.04deg); }
  37.5% { transform: rotate(-2.12deg); }
  41.6667% { transform: rotate(8.65deg); }
  45.8333% { transform: rotate(18.98deg); }
  50% { transform: rotate(28.62deg); }
  54.1667% { transform: rotate(37.22deg); }
  58.3333% { transform: rotate(44.40deg); }
  62.5% { transform: rotate(49.67deg); }
  66.6667% { transform: rotate(52.60deg); }
  70.8333% { transform: rotate(52.87deg); }
  75% { transform: rotate(50.44deg); }
  79.1667% { transform: rotate(45.59deg); }
  83.3333% { transform: rotate(38.75deg); }
  87.5% { transform: rotate(30.39deg); }
  91.6667% { transform: rotate(20.93deg); }
  95.8333% { transform: rotate(10.70deg); }
  100% { transform: rotate(-0.00deg); }
}
@keyframes thighB {
  0% { transform: rotate(-0.00deg); }
  4.16667% { transform: rotate(-5.53deg); }
  8.33333% { transform: rotate(-11.71deg); }
  12.5% { transform: rotate(-18.33deg); }
  16.6667% { transform: rotate(-24.86deg); }
  20.8333% { transform: rotate(-30.49deg); }
  25% { transform: rotate(-34.34deg); }
  29.1667% { transform: rotate(-35.87deg); }
  33.3333% { transform: rotate(-34.97deg); }
  37.5% { transform: rotate(-31.91deg); }
  41.6667% { transform: rotate(-27.07deg); }
  45.8333% { transform: rotate(-20.87deg); }
  50% { transform: rotate(-13.68deg); }
  54.1667% { transform: rotate(-5.82deg); }
  58.3333% { transform: rotate(2.38deg); }
  62.5% { transform: rotate(10.43deg); }
  66.6667% { transform: rotate(17.30deg); }
  70.8333% { transform: rotate(20.89deg); }
  75% { transform: rotate(20.75deg); }
  79.1667% { transform: rotate(18.80deg); }
  83.3333% { transform: rotate(16.07deg); }
  87.5% { transform: rotate(12.82deg); }
  91.6667% { transform: rotate(9.10deg); }
  95.8333% { transform: rotate(4.85deg); }
  100% { transform: rotate(-0.00deg); }
}
@keyframes shinB {
  0% { transform: rotate(-0.00deg); }
  4.16667% { transform: rotate(8.60deg); }
  8.33333% { transform: rotate(15.78deg); }
  12.5% { transform: rotate(21.06deg); }
  16.6667% { transform: rotate(23.98deg); }
  20.8333% { transform: rotate(24.25deg); }
  25% { transform: rotate(21.82deg); }
  29.1667% { transform: rotate(16.97deg); }
  33.3333% { transform: rotate(10.13deg); }
  37.5% { transform: rotate(1.77deg); }
  41.6667% { transform: rotate(-7.69deg); }
  45.8333% { transform: rotate(-17.91deg); }
  50% { transform: rotate(-28.62deg); }
  54.1667% { transform: rotate(-39.53deg); }
  58.3333% { transform: rotate(-50.31deg); }
  62.5% { transform: rotate(-60.28deg); }
  66.6667% { transform: rotate(-67.63deg); }
  70.8333% { transform: rotate(-68.43deg); }
  75% { transform: rotate(-62.02deg); }
  79.1667% { transform: rotate(-52.35deg); }
  83.3333% { transform: rotate(-41.66deg); }
  87.5% { transform: rotate(-30.74deg); }
  91.6667% { transform: rotate(-19.97deg); }
  95.8333% { transform: rotate(-9.63deg); }
  100% { transform: rotate(-0.00deg); }
}
</style>
</head>
<body>

<svg viewBox="0 0 900 500" role="img" aria-label="一只鹈鹕骑着自行车向前骑行">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#b9e6ff"/>
      <stop offset="0.7" stop-color="#e6f7ff"/>
      <stop offset="1"   stop-color="#f6fcff"/>
    </linearGradient>

    <radialGradient id="sunGlow">
      <stop offset="0"   stop-color="#fff6bd" stop-opacity=".95"/>
      <stop offset="1"   stop-color="#fff6bd" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dash" width="60" height="10" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="32" height="10" rx="5" fill="#eef3fa"/>
    </pattern>

    <pattern id="grass" width="50" height="28" patternUnits="userSpaceOnUse">
      <path d="M4,28 Q25,2 46,28 Z"   fill="#6bbf8b"/>
      <path d="M14,28 Q25,12 36,28 Z" fill="#8ad4a6"/>
    </pattern>

    <!-- 车轮：轮胎 / 轮圈 / 辐条 / 花鼓 -->
    <g id="wheelParts">
      <circle cx="272" cy="378" r="78" fill="none" stroke="#2b2f3a" stroke-width="13"/>
      <circle cx="272" cy="378" r="66" fill="none" stroke="#eef3fa" stroke-width="6"/>
      <g stroke="#c3cbd9" stroke-width="3" stroke-linecap="round">
        <line x1="208"   y1="378"   x2="336"   y2="378"/>
        <line x1="240"   y1="433.4" x2="304"   y2="322.6"/>
        <line x1="216.6" y1="410"   x2="327.4" y2="346"/>
        <line x1="272"   y1="314"   x2="272"   y2="442"/>
        <line x1="304"   y1="433.4" x2="240"   y2="322.6"/>
        <line x1="327.4" y1="410"   x2="216.6" y2="346"/>
      </g>
      <circle cx="272" cy="378" r="9" fill="#2b2f3a"/>
      <circle cx="272" cy="378" r="4" fill="#eef3fa"/>
    </g>
  </defs>

  <!-- ================= 天空 ================= -->
  <rect width="900" height="500" fill="url(#sky)"/>

  <!-- ================= 太阳 ================= -->
  <g class="sun">
    <circle cx="120" cy="96" r="86" fill="url(#sunGlow)"/>
    <circle cx="120" cy="96" r="40" fill="#ffe07a"/>
  </g>

  <!-- ================= 云（最慢） ================= -->
  <g class="clouds" fill="#ffffff" opacity=".95">
    <g id="cloudSet">
      <g>
        <ellipse cx="150" cy="92"  rx="46" ry="26"/>
        <ellipse cx="198" cy="82"  rx="34" ry="23"/>
        <ellipse cx="110" cy="84"  rx="28" ry="19"/>
      </g>
      <g>
        <ellipse cx="520" cy="142" rx="40" ry="22"/>
        <ellipse cx="560" cy="134" rx="28" ry="18"/>
        <ellipse cx="488" cy="136" rx="24" ry="15"/>
      </g>
      <g>
        <ellipse cx="782" cy="72"  rx="52" ry="28"/>
        <ellipse cx="836" cy="64"  rx="32" ry="20"/>
        <ellipse cx="740" cy="66"  rx="30" ry="20"/>
      </g>
    </g>
    <use href="#cloudSet" x="900"/>
  </g>

  <!-- ================= 远山 ================= -->
  <g class="hills-far">
    <g id="hillFarSet">
      <path d="M0,430 Q75,390 150,430 T300,430 T450,430 T600,430 T750,430 T900,430 L900,500 L0,500 Z" fill="#a8d8b9"/>
    </g>
    <use href="#hillFarSet" x="900"/>
  </g>

  <!-- ================= 近山 + 树 ================= -->
  <g class="hills-near">
    <g id="hillNearSet">
      <path d="M0,430 Q112.5,375 225,430 T450,430 T675,430 T900,430 L900,500 L0,500 Z" fill="#7cc79a"/>
      <g>
        <rect x="108" y="372" width="8" height="34" fill="#8a6a4a"/>
        <circle cx="112" cy="368" r="20" fill="#5fae7c"/>
        <circle cx="100" cy="376" r="14" fill="#6fbf8c"/>
        <circle cx="124" cy="376" r="14" fill="#6fbf8c"/>
      </g>
      <g>
        <rect x="558" y="372" width="8" height="34" fill="#8a6a4a"/>
        <circle cx="562" cy="366" r="22" fill="#5fae7c"/>
        <circle cx="548" cy="376" r="15" fill="#6fbf8c"/>
        <circle cx="576" cy="376" r="15" fill="#6fbf8c"/>
      </g>
    </g>
    <use href="#hillNearSet" x="900"/>
  </g>

  <!-- ================= 马路 ================= -->
  <rect x="0" y="430" width="900" height="70" fill="#5c6472"/>
  <rect x="0" y="430" width="900" height="6"  fill="#7c8699"/>
  <g class="dashes"><rect x="-60" y="470" width="1020" height="10" fill="url(#dash)"/></g>
  <g class="grass"><rect x="-50" y="406" width="1000" height="28" fill="url(#grass)"/></g>

  <!-- 地面阴影 -->
  <ellipse cx="452" cy="458" rx="205" ry="13" fill="#3e4552" opacity=".32"/>

  <!-- ================= 自行车 ================= -->
  <!-- 后轮 / 前轮 -->
  <g class="wheel-rear"><use href="#wheelParts"/></g>
  <g class="wheel-front"><use href="#wheelParts" x="356"/></g>

  <!-- 远侧腿（较暗，被车架遮挡） -->
  <g class="leg leg-far">
    <g class="thigh">
      <path d="M408,268 L461.4,313.3" fill="none" stroke="#c97f17" stroke-width="17" stroke-linecap="round"/>
      <g class="shin">
        <path d="M461.4,313.3 L418.0,372.0" fill="none" stroke="#c97f17" stroke-width="15" stroke-linecap="round"/>
        <ellipse cx="418.0" cy="372.0" rx="15" ry="8" fill="#c97f17" stroke="#2b2f3a" stroke-width="3"/>
      </g>
    </g>
  </g>

  <!-- 车架 -->
  <g fill="none" stroke="#e4572e" stroke-width="9" stroke-linecap="round">
    <path d="M272,378 L448,372"/>
    <path d="M272,378 L398,266"/>
    <path d="M448,372 L398,266"/>
    <path d="M448,372 L602,316"/>
    <path d="M404,270 L612,278"/>
    <path d="M600,318 L614,276"/>
    <path d="M602,318 L628,378"/>
  </g>
  <!-- 链条 / 齿盘 -->
  <g fill="none" stroke="#b9c2d0" stroke-width="3">
    <path d="M448,352 L272,369" stroke-dasharray="6 4"/>
    <path d="M448,392 L272,387" stroke-dasharray="6 4"/>
    <circle cx="448" cy="372" r="20" stroke-width="4"/>
    <circle cx="272" cy="378" r="10"/>
  </g>
  <!-- 车座 + 车把 -->
  <path d="M366,258 C380,246 412,246 424,256 C430,262 424,270 410,271 C392,272 372,268 366,262 Z" fill="#2b2f3a"/>
  <path d="M614,276 L622,252 C628,238 640,236 652,242" fill="none" stroke="#2b2f3a" stroke-width="8" stroke-linecap="round"/>

  <!-- 曲柄 + 脚踏 -->
  <g class="crank">
    <path d="M448,372 L478,372" fill="none" stroke="#2b2f3a" stroke-width="9" stroke-linecap="round"/>
    <path d="M448,372 L418,372" fill="none" stroke="#2b2f3a" stroke-width="9" stroke-linecap="round"/>
    <rect x="462" y="366" width="32" height="11" rx="4" fill="#f5a623" stroke="#2b2f3a" stroke-width="3"/>
    <rect x="402" y="366" width="32" height="11" rx="4" fill="#f5a623" stroke="#2b2f3a" stroke-width="3"/>
  </g>

  <!-- 近侧腿（亮色，踩在脚踏上） -->
  <g class="leg leg-near">
    <g class="thigh">
      <path d="M408,268 L470.6,299.4" fill="none" stroke="#f5a623" stroke-width="17" stroke-linecap="round"/>
      <g class="shin">
        <path d="M470.6,299.4 L478.0,372.0" fill="none" stroke="#f5a623" stroke-width="15" stroke-linecap="round"/>
        <ellipse cx="478.0" cy="372.0" rx="15" ry="8" fill="#f5a623" stroke="#2b2f3a" stroke-width="3"/>
      </g>
    </g>
  </g>

  <!-- ================= 鹈鹕 ================= -->
  <g class="pelican">
    <!-- 尾羽 -->
    <path d="M340,244 C316,228 292,226 280,238 C292,250 314,260 344,258 Z"
          fill="#ffffff" stroke="#2b2f3a" stroke-width="4" stroke-linejoin="round"/>
    <!-- 身体 -->
    <ellipse cx="392" cy="232" rx="64" ry="54" fill="#ffffff" stroke="#2b2f3a" stroke-width="4"/>
    <path d="M342,262 C362,284 418,290 444,264" fill="none" stroke="#dce3ec" stroke-width="9" stroke-linecap="round"/>
    <!-- 收起的翅膀（贴在身上，增加层次） -->
    <path d="M430,238 C410,224 378,222 352,232 C356,244 372,254 392,256 C410,257 424,250 430,238 Z"
          fill="#dde8f5" stroke="#2b2f3a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M364,238 C382,234 400,236 414,243" fill="none" stroke="#c7d5e6" stroke-width="3" stroke-linecap="round"/>
    <!-- 脖子（先描边再填白，得到均匀轮廓） -->
    <path d="M424,208 C442,180 460,158 484,146" fill="none" stroke="#2b2f3a" stroke-width="42" stroke-linecap="round"/>
    <path d="M424,208 C442,180 460,158 484,146" fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round"/>
    <!-- 围巾领口 + 飘带 -->
    <path d="M420,198 C438,208 462,208 478,198" fill="none" stroke="#e4572e" stroke-width="15" stroke-linecap="round"/>
    <path class="scarf" d="M424,192 C392,176 356,168 326,174 C322,190 340,202 366,206 C392,210 410,212 424,214 Z"
          fill="#e4572e" stroke="#2b2f3a" stroke-width="3" stroke-linejoin="round"/>

    <!-- 头部 -->
    <g class="head">
      <circle cx="496" cy="138" r="30" fill="#ffffff" stroke="#2b2f3a" stroke-width="4"/>
      <!-- 喙：上颌 -->
      <path d="M514,124 C570,126 640,132 692,140 L694,149 C640,147 566,147 512,146 Z"
            fill="#f5a623" stroke="#2b2f3a" stroke-width="4" stroke-linejoin="round"/>
      <!-- 喙：喉囊 -->
      <path d="M512,148 C526,206 612,210 690,152 C620,182 560,178 512,148 Z"
            fill="#f7b84b" stroke="#2b2f3a" stroke-width="4" stroke-linejoin="round"/>
      <!-- 眼睛 -->
      <circle cx="506" cy="128" r="7" fill="#2b2f3a"/>
      <circle cx="508" cy="126" r="2.6" fill="#ffffff"/>
      <!-- 头部高光 -->
      <path d="M478,120 C484,110 494,106 504,108" fill="none" stroke="#eef3fa" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- 翅膀（伸向车把） -->
    <g class="wing">
      <path d="M438,200 C496,198 552,210 604,226 C626,233 646,240 654,246 C652,252 640,256 624,253 C576,244 512,234 434,224 Z"
            fill="#ffffff" stroke="#2b2f3a" stroke-width="4" stroke-linejoin="round"/>
      <path d="M488,206 C536,214 586,226 630,240" fill="none" stroke="#dce3ec" stroke-width="4" stroke-linecap="round"/>
      <path d="M484,214 C532,222 582,234 626,248" fill="none" stroke="#dce3ec" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
</svg>

</body>
</html>
