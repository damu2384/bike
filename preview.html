<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bike Lab · 动画预览</title>
  <style>
    :root {
      --ink: #18221d;
      --muted: #6d786f;
      --line: #dce4dd;
      --paper: #f7f8f3;
      --panel: #ffffff;
      --accent: #d84f35;
      --accent-soft: #fff0ea;
      --green: #2f6b52;
      --shadow: 0 18px 48px rgba(34, 55, 42, .11);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        radial-gradient(circle at 90% 0%, rgba(220, 239, 216, .9), transparent 32rem),
        linear-gradient(135deg, #f7f8f3 0%, #eef3eb 100%);
      font-family: Georgia, "Noto Serif SC", serif;
    }

    button, input { font: inherit; }

    .app-shell {
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      min-height: 100vh;
      padding: 20px;
      gap: 20px;
    }

    .sidebar, .stage {
      border: 1px solid rgba(47, 107, 82, .14);
      background: rgba(255, 255, 255, .82);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 40px);
      border-radius: 22px;
      padding: 26px 18px 18px;
    }

    .eyebrow {
      margin: 0 8px 8px;
      color: var(--accent);
      font: 700 11px/1.2 Arial, sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 8px 8px;
      font-size: clamp(27px, 3vw, 38px);
      line-height: 1;
      letter-spacing: -.04em;
    }

    .intro {
      margin: 0 8px 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .search {
      position: relative;
      margin: 0 2px 14px;
    }

    .search input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 13px 11px 36px;
      outline: none;
      color: var(--ink);
      background: var(--paper);
      font: 14px Arial, sans-serif;
    }

    .search input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(47, 107, 82, .12); }
    .search::before { content: "⌕"; position: absolute; z-index: 1; top: 7px; left: 13px; color: var(--muted); font-size: 22px; }

    .file-list {
      display: grid;
      gap: 5px;
      overflow: auto;
      padding: 0 2px;
    }

    .file-button {
      display: flex;
      align-items: center;
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 11px 12px;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition: background .18s ease, color .18s ease, transform .18s ease;
    }

    .file-button:hover { background: #edf3ed; transform: translateX(2px); }
    .file-button[aria-current="true"] { color: #fff; background: var(--green); }
    .file-number { width: 27px; color: var(--muted); font: 700 11px Arial, sans-serif; }
    .file-button[aria-current="true"] .file-number { color: #cce2d2; }
    .file-name { overflow: hidden; font: 14px Arial, sans-serif; text-overflow: ellipsis; white-space: nowrap; }

    .sidebar-footer {
      margin: auto 8px 0;
      padding-top: 20px;
      color: var(--muted);
      font: 12px/1.5 Arial, sans-serif;
    }

    .stage {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: calc(100vh - 40px);
      overflow: hidden;
      border-radius: 22px;
    }

    .stage-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 74px;
      border-bottom: 1px solid var(--line);
      padding: 16px 22px;
    }

    .stage-title { min-width: 0; }
    .stage-title strong { display: block; overflow: hidden; font-size: 18px; text-overflow: ellipsis; white-space: nowrap; }
    .stage-title span { display: block; margin-top: 4px; color: var(--muted); font: 12px Arial, sans-serif; }

    .open-link {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 12px;
      color: var(--green);
      background: var(--panel);
      font: 12px Arial, sans-serif;
      text-decoration: none;
    }

    .open-link:hover { border-color: var(--green); background: #f1f7f1; }

    .frame-wrap {
      position: relative;
      flex: 1;
      min-height: 520px;
      padding: 18px;
      background: #e9eee9;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 484px;
      border: 0;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 4px 20px rgba(26, 52, 36, .1);
    }

    .empty { padding: 28px 12px; color: var(--muted); font: 13px Arial, sans-serif; text-align: center; }

    @media (max-width: 800px) {
      .app-shell { grid-template-columns: 1fr; padding: 10px; gap: 10px; }
      .sidebar { min-height: auto; padding: 18px 12px 12px; }
      .intro { margin-bottom: 16px; }
      .file-list { grid-template-columns: repeat(2, minmax(0, 1fr)); max-height: 184px; }
      .sidebar-footer { display: none; }
      .stage { min-height: 70vh; }
      .frame-wrap { min-height: 460px; padding: 10px; }
      iframe { min-height: 440px; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar">
      <p class="eyebrow">Bike Lab / 2026</p>
      <h1>动画预览</h1>
      <p class="intro">收集每一版鹈鹕骑车动画，在同一个工作台里快速切换。</p>
      <label class="search">
        <span hidden>搜索文件</span>
        <input id="search" type="search" placeholder="搜索文件..." autocomplete="off">
      </label>
      <nav id="file-list" class="file-list" aria-label="HTML 文件列表"></nav>
      <p class="sidebar-footer">共 <span id="count">13</span> 个可预览版本</p>
    </aside>

    <section class="stage" aria-label="文件预览">
      <header class="stage-header">
        <div class="stage-title">
          <strong id="current-name">请选择一个文件</strong>
          <span id="current-path">页面内预览</span>
        </div>
        <a id="open-link" class="open-link" href="#" target="_blank" rel="noopener">新窗口打开 ↗</a>
      </header>
      <div class="frame-wrap">
        <iframe id="preview-frame" title="HTML 文件预览" src="about:blank"></iframe>
      </div>
    </section>
  </main>

  <script>
    const files = [
      "AGdsv4flash.html", "AGglm5.3.html", "AGopus5.html", "dumate.html",
      "gpt5.6solmedium.html", "gpt5.6solmediumto4o.html", "gpt6astralow.html", "hy4.html",
      "officialdsv4.1.html", "shangtang glm5.2.html", "shangtang k3.html", "shangtang u6.8.html",
      "shangtang v4pro.html"
    ];

    const list = document.querySelector("#file-list");
    const frame = document.querySelector("#preview-frame");
    const currentName = document.querySelector("#current-name");
    const currentPath = document.querySelector("#current-path");
    const openLink = document.querySelector("#open-link");
    const search = document.querySelector("#search");
    const count = document.querySelector("#count");

    function encodePath(file) {
      return encodeURI(file);
    }

    function selectFile(file, button) {
      const path = encodePath(file);
      frame.src = path;
      currentName.textContent = file;
      currentPath.textContent = `正在预览 · ${path}`;
      openLink.href = path;
      document.querySelectorAll(".file-button").forEach((item) => item.setAttribute("aria-current", "false"));
      button.setAttribute("aria-current", "true");
      history.replaceState(null, "", `#${encodeURIComponent(file)}`);
    }

    function render(filter = "") {
      const visibleFiles = files.filter((file) => file.toLowerCase().includes(filter.toLowerCase().trim()));
      count.textContent = visibleFiles.length;
      list.innerHTML = "";
      visibleFiles.forEach((file) => {
        const button = document.createElement("button");
        button.className = "file-button";
        button.type = "button";
        button.setAttribute("aria-current", "false");
        button.innerHTML = `<span class="file-number">${String(files.indexOf(file) + 1).padStart(2, "0")}</span><span class="file-name">${file}</span>`;
        button.addEventListener("click", () => selectFile(file, button));
        list.appendChild(button);
      });
      if (!visibleFiles.length) list.innerHTML = '<p class="empty">没有匹配的文件</p>';
    }

    search.addEventListener("input", (event) => render(event.target.value));
    render();

    const hashFile = decodeURIComponent(location.hash.slice(1));
    const initialFile = files.includes(hashFile) ? hashFile : files[0];
    const initialButton = [...document.querySelectorAll(".file-button")].find((button) => button.textContent.includes(initialFile));
    selectFile(initialFile, initialButton);
  </script>
</body>
</html>
